name: Build iOS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Flutter project
        run: |
          cd mobile
          flutter create --project-name devtoolbox_mobile --org com.devtoolbox --platforms android,ios .

      - name: Restore source code
        run: |
          cd mobile
          git checkout -- lib/ pubspec.yaml analysis_options.yaml

      - name: Get dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build iOS (no codesign)
        run: |
          cd mobile
          flutter build ios --release --no-codesign

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: mobile/build/ios/iphoneos/Runner.app
